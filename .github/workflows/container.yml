name: Publish container
on:
  release:
    types:
      - published
permissions:
  contents: read
concurrency:
  group: container-${{ github.event.release.tag_name }}
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  ci:
    name: Required CI
    uses: ./.github/workflows/ci.yml
  images:
    uses: abhi1693/actions/.github/workflows/container-images.yml@34e92ba1eee6a47e9b10f13e2180114fc01b6027
    with:
      manifest: .github/images.json
      publish: true
      version-file: pyproject.toml
      release-aliases: '["minor"]'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs: ci
