---
name: CI

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install development tooling
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests with branch coverage
        env:
          PYTHONPATH: src
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

      - name: Compile source
        run: python -m compileall -q src tests

  typecheck:
    name: Strict typing
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install development tooling
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check types
        run: mypy --strict src

  container:
    name: Native runtime images
    needs: [test, typecheck]
    uses: abhi1693/actions/.github/workflows/container-images.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      manifest: .github/images.json
      publish: false
      version-file: pyproject.toml
      changed-only: false
      artifact-scope: ci-images
