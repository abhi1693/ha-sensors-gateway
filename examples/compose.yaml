---
services:
  gateway:
    image: ghcr.io/abhi1693/ha-sensors-gateway:0.1.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      UPSTREAM_URL: http://home-assistant:8123
    volumes:
      - ./webhooks.json:/run/secrets/webhooks.json:ro
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 8080), 3).close()
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - home-assistant

networks:
  home-assistant:
    external: true
