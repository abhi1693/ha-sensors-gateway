---
services:
  gateway:
    image: ghcr.io/abhi1693/ha-sensors-gateway:0.2.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      UPSTREAM_URL: http://home-assistant:8123
      PORT: ${PORT:-8080}
    volumes:
      - ./webhooks.json:/run/secrets/webhooks.json:ro
    ports:
      - 127.0.0.1:${PORT:-8080}:${PORT:-8080}
    networks:
      - home-assistant

networks:
  home-assistant:
    external: true
